<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>剧情编辑器</title>
<link rel="stylesheet" href="/editor-static/editor_v2.css" />
</head>
<body>
<div class="layout">
  <aside class="pane left-pane">
    <div class="card hero-card">
      <h1>剧情编辑器</h1>
      <div id="editorPath" class="muted">未加载文档</div>
    </div>
    <div class="card">
      <div class="row two">
        <button id="saveBtn" type="button">保存并编译</button>
        <button id="showTxtBtn" type="button" class="secondary">查看导出 TXT</button>
      </div>
      <div id="status" class="muted status">等待加载</div>
    </div>
    <div class="card">
      <label class="label" for="docTitle">文档标题</label>
      <input id="docTitle" type="text" placeholder="输入文档标题" />
    </div>
    <div class="card stretch">
      <h2>块操作</h2>
      <div id="selectedSummary" class="muted">请在中间预览区点击一个块。</div>
      <div class="action-list">
        <button id="insertBtn" type="button" class="secondary">插入</button>
        <button id="moveUpBtn" type="button" class="secondary">上移</button>
        <button id="moveDownBtn" type="button" class="secondary">下移</button>
        <button id="deleteBtn" type="button" class="danger">删除</button>
      </div>
    </div>
  </aside>

  <main class="pane center-pane">
    <div class="center-scroll">
      <div id="previewTitle" class="preview-title"></div>
      <div id="previewRoot" class="preview-root"></div>
    </div>
  </main>

  <aside class="pane right-pane">
    <div class="card">
      <h2>新增块</h2>
      <div id="addBlockGrid" class="button-grid"></div>
    </div>
    <div class="card stretch">
      <h2>当前块操作</h2>
      <div id="selectionTools" class="tools-empty muted">选择块后，这里会出现倾斜、分支、设定等操作。</div>
    </div>
  </aside>
</div>

<div class="modal" id="insertModal">
  <div class="modal-card narrow">
    <div class="modal-head">
      <h2>选择插入类型</h2>
      <button type="button" class="ghost close-btn" data-close="insertModal">×</button>
    </div>
    <div id="insertTypeGrid" class="button-grid compact"></div>
  </div>
</div>

<div class="modal" id="txtModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>导出 TXT 预览</h2>
      <button type="button" class="ghost close-btn" data-close="txtModal">×</button>
    </div>
    <pre id="compiledText"></pre>
  </div>
</div>

<div class="modal" id="annotationModal">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2 id="annotationTitle">设定</h2>
        <div id="annotationSource" class="muted"></div>
      </div>
      <button type="button" class="ghost close-btn" data-close="annotationModal">×</button>
    </div>
    <div id="annotationBody" class="annotation-body"></div>
  </div>
</div>

<div class="modal" id="summaryModal">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2>梗概</h2>
      </div>
      <button type="button" class="ghost close-btn" data-close="summaryModal">×</button>
    </div>
    <div id="summaryBody" class="annotation-body"></div>
  </div>
</div>

<div class="modal" id="createAnnotationModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2>新建设定</h2>
      <button type="button" class="ghost close-btn" data-close="createAnnotationModal">×</button>
    </div>
    <div class="field">
      <label class="label" for="createAnnotationTerm">设定</label>
      <input id="createAnnotationTerm" type="text" />
    </div>
    <div class="field">
      <label class="label" for="createAnnotationDefinition">设定内容</label>
      <textarea id="createAnnotationDefinition" rows="6" placeholder="输入设定内容"></textarea>
    </div>
    <div class="field">
      <label class="label" for="createAnnotationTarget">保存到</label>
      <select id="createAnnotationTarget" size="10"></select>
    </div>
    <button id="submitCreateAnnotationBtn" type="button">创建并引用</button>
  </div>
</div>

<script src="/editor-static/editor_v2.js"></script>
</body>
</html>
